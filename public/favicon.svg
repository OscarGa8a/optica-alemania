<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#00205B"/>
  <!-- Elegant minimalist eyewear frame -->
  <circle cx="11" cy="16.5" r="4.5" stroke="#F3EFE7" stroke-width="1.6"/>
  <circle cx="21" cy="16.5" r="4.5" stroke="#F3EFE7" stroke-width="1.6"/>
  <!-- Frame bridge -->
  <path d="M15.5 15.5C15.8 15 16.2 15 16.5 15.5" stroke="#F3EFE7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Left temple hinge -->
  <line x1="6.5" y1="15.5" x2="4" y2="15" stroke="#F3EFE7" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Right temple hinge -->
  <line x1="25.5" y1="15.5" x2="28" y2="15" stroke="#F3EFE7" stroke-width="1.6" stroke-linecap="round"/>
</svg>
